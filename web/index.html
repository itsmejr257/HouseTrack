<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blk 301–303 Punggol</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏢</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #EDF3F1;
    --surface: #FFFFFF;
    --ink: #12302E;
    --muted: #5B716E;
    --line: #D3E0DC;
    --b301: #0B6E69;
    --b302: #2F5DA8;
    --b303: #A86A12;
    --sign-ink: #FFFFFF;
    --new: #F2C14E;
    --warn-bg: #FFF4D6;
    --warn-ink: #6B4A00;
    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0F1D1C; --surface: #172826; --ink: #E4EFEC; --muted: #93AAA6;
      --line: #28403D; --b301: #1C9A93; --b302: #4C7FD1; --b303: #C98A2A;
      --warn-bg: #3A2F12; --warn-ink: #F5D98A;
    }
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 400 16px/1.5 var(--body);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 20px 64px; }

  header h1 {
    font: 800 clamp(2.4rem, 7vw, 4rem)/0.95 var(--display);
    letter-spacing: -0.01em; margin: 0 0 12px;
  }
  .status { color: var(--muted); margin: 0; font-size: 0.95rem; }
  .status strong { color: var(--ink); font-weight: 600; }

  .notice {
    margin: 20px 0 0; padding: 12px 16px; border-radius: 6px;
    background: var(--warn-bg); color: var(--warn-ink); font-size: 0.95rem;
  }

  /* The three block tiles are the page's one loud element: painted HDB block numbers. */
  .blocks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 32px 0 8px; }
  .block {
    appearance: none; border: 0; cursor: pointer; text-align: left;
    background: var(--c); color: var(--sign-ink);
    padding: 14px 16px 12px; border-radius: 4px;
    font-family: var(--body);
    transition: transform .15s ease, opacity .15s ease;
    opacity: .45;
  }
  .block[aria-pressed="true"] { opacity: 1; }
  .block:hover { opacity: .85; }
  .block[aria-pressed="true"]:hover { opacity: 1; }
  .block:active { transform: scale(.98); }
  .block:focus-visible, .ctl:focus-visible, a:focus-visible {
    outline: 3px solid var(--ink); outline-offset: 3px;
  }
  .block .num { display: block; font: 800 clamp(2.6rem, 11vw, 4.5rem)/0.9 var(--display); }
  .block .count { display: block; margin-top: 6px; font-size: .9rem; font-weight: 500; }

  .controls {
    display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center;
    justify-content: space-between; margin: 20px 0 12px;
  }
  .controls .left { display: flex; gap: 6px; flex-wrap: wrap; }
  .ctl {
    font: 500 .9rem var(--body); color: var(--ink);
    background: transparent; border: 1px solid var(--line);
    padding: 6px 12px; border-radius: 999px; cursor: pointer;
  }
  .ctl[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  select.ctl { padding-right: 8px; background: var(--surface); }
  label.sort { color: var(--muted); font-size: .9rem; display: flex; gap: 8px; align-items: center; }

  ul.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  li.unit {
    display: grid; grid-template-columns: 76px 1fr auto; gap: 16px; align-items: center;
    padding: 16px 4px; border-bottom: 1px solid var(--line);
  }
  .sign {
    background: var(--c); color: var(--sign-ink); border-radius: 3px;
    font: 700 1.5rem/1 var(--display); text-align: center; padding: 10px 4px 8px;
  }
  .price { font: 700 1.5rem/1.1 var(--display); letter-spacing: .01em; }
  .addr { color: var(--muted); font-size: .95rem; margin-top: 2px; overflow-wrap: anywhere; }
  .tag {
    display: inline-block; vertical-align: 3px; margin-left: 8px;
    background: var(--new); color: #3A2A00; font: 600 .75rem/1 var(--body);
    padding: 4px 7px; border-radius: 3px;
  }
  .tag.stale { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .kind { color: var(--muted); font-size: .8rem; margin-left: 8px; font-family: var(--body); font-weight: 500; }
  a.open {
    color: var(--ink); font-weight: 600; font-size: .9rem; white-space: nowrap;
    text-decoration: underline; text-underline-offset: 3px; text-decoration-color: var(--line);
  }
  a.open:hover { text-decoration-color: currentColor; }

  .tabs { display: flex; gap: 20px; margin: 28px 0 0; border-bottom: 1px solid var(--line); }
  .tab {
    appearance: none; background: none; border: 0; cursor: pointer;
    font: 600 1rem var(--body); color: var(--muted);
    padding: 8px 0 10px; margin-bottom: -1px; border-bottom: 2px solid transparent;
  }
  .tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }

  h2.daygroup {
    font: 700 1.05rem/1.2 var(--body); margin: 26px 0 0; padding: 0 4px 8px;
    color: var(--ink); border-bottom: 1px solid var(--line);
  }
  h2.daygroup:first-child { margin-top: 8px; }
  h2.daygroup span { color: var(--muted); font-weight: 500; font-size: .85rem; margin-left: 8px; }
  ul.list.grouped { border-top: 0; }

  .logbar { display: flex; gap: 12px; align-items: center; margin: 16px 0 10px; color: var(--muted); font-size: .9rem; }
  pre.log {
    margin: 0; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 6px; max-height: 65vh; overflow: auto;
    font: 400 .82rem/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre; color: var(--ink);
  }
  pre.log .warn { color: #B4641A; }
  pre.log .err { color: #B3261E; }
  @media (prefers-color-scheme: dark) {
    pre.log .warn { color: #E8A75A; }
    pre.log .err { color: #F2846B; }
  }

  .empty { padding: 40px 4px; color: var(--muted); }
  .empty strong { display: block; color: var(--ink); font-size: 1.1rem; margin-bottom: 4px; }

  @media (max-width: 560px) {
    .wrap { padding-top: 28px; }
    .blocks { gap: 8px; }
    .block { padding: 10px 10px 8px; }
    li.unit { grid-template-columns: 60px 1fr; gap: 12px; }
    li.unit a.open { grid-column: 2; }
    .sign { font-size: 1.25rem; }
  }
  @media (prefers-reduced-motion: reduce) { .block { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Blk 301–303 Punggol</h1>
    <p class="status" id="status">Loading the latest check…</p>
    <div class="notice" id="notice" hidden></div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab" id="tab-units" role="tab" aria-selected="true" aria-controls="panel-units">Units</button>
    <button class="tab" id="tab-logs" role="tab" aria-selected="false" aria-controls="panel-logs">Logs</button>
  </div>

<div id="panel-units" role="tabpanel">
  <div class="blocks" id="blocks"></div>

  <div class="controls">
    <div class="left" id="modes"></div>
    <label class="sort">Sort
      <select class="ctl" id="sort">
        <option value="price-asc">Price, low to high</option>
        <option value="price-desc">Price, high to low</option>
        <option value="new">Newest found</option>
        <option value="date">Date listed</option>
        <option value="block">Block</option>
      </select>
    </label>
  </div>

  <ul class="list" id="list"></ul>
</div>

<div id="panel-logs" role="tabpanel" hidden>
  <div class="logbar">
    <span id="log-status">Loading the log…</span>
    <button class="ctl" id="log-refresh" type="button">Refresh</button>
  </div>
  <pre class="log" id="log"></pre>
</div>
</div>

<script>
const BLOCKS = ["301", "302", "303"];
const COLORS = { "301": "var(--b301)", "302": "var(--b302)", "303": "var(--b303)" };
const state = { data: null, blocks: new Set(BLOCKS), mode: "all", sort: "price-asc" };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const priceNum = (p) => {
  const m = String(p || "").replace(/,/g, "").match(/\d+(\.\d+)?/);
  return m ? parseFloat(m[0]) : Infinity;
};
const fmtDate = (iso) => iso ? new Date(iso).toLocaleString("en-SG", {
  day: "numeric", month: "short", hour: "numeric", minute: "2-digit"
}) : "never";
const baseBlock = (b) => String(b || "").slice(0, 3);
const plural = (n) => `${n} unit${n === 1 ? "" : "s"}`;

function isNew(l, updated) {
  if (!l.first_seen || !updated) return false;
  return (new Date(updated) - new Date(l.first_seen)) < 36 * 3600 * 1000;
}

function inMode(l) { return state.mode === "all" || l.mode === state.mode; }

function renderHeader() {
  const d = state.data;
  const total = d.listings.filter(inMode).length;
  const status = $("status"), notice = $("notice");
  if (d.status === "pending" || !d.updated_at) {
    status.textContent = "The first check hasn't finished yet. This page fills in once it does.";
  } else {
    status.innerHTML = `<strong>${plural(total)}</strong> listed. Last checked ${esc(fmtDate(d.updated_at))}.`;
  }
  notice.hidden = true;
  if (d.status === "blocked" || d.status === "error") {
    notice.hidden = false;
    notice.textContent = `The last check couldn't load PropertyGuru${d.message ? ` (${d.message})` : ""}. ` +
      `Showing results from ${fmtDate(d.last_success_at)}. Check the pg-punggol-scraper logs in ZimaOS.`;
  } else if (d.status === "partial") {
    notice.hidden = false;
    notice.textContent = `${d.message}, so a few units may be missing.`;
  }
}

function renderBlocks() {
  const counts = Object.fromEntries(BLOCKS.map((b) => [b, 0]));
  state.data.listings.filter(inMode).forEach((l) => { counts[baseBlock(l.block)] += 1; });
  $("blocks").innerHTML = BLOCKS.map((b) => `
    <button class="block" style="--c:${COLORS[b]}" data-block="${b}"
      aria-pressed="${state.blocks.has(b)}" aria-label="Block ${b}, ${plural(counts[b])}">
      <span class="num">${b}</span><span class="count">${plural(counts[b])}</span>
    </button>`).join("");
}

function renderModes() {
  const modes = state.data.modes || [];
  if (modes.length < 2) { $("modes").innerHTML = ""; return; }
  const opts = [["all", "All"], ["sale", "For sale"], ["rent", "For rent"]]
    .filter(([k]) => k === "all" || modes.includes(k));
  $("modes").innerHTML = opts.map(([k, label]) =>
    `<button class="ctl" data-mode="${k}" aria-pressed="${state.mode === k}">${label}</button>`).join("");
}

function renderList() {
  const d = state.data;
  let rows = d.listings.filter((l) => inMode(l) && state.blocks.has(baseBlock(l.block)));
  const s = state.sort;
  rows.sort((a, b) =>
    // Keep sale and rent apart so monthly rents don't sort in among sale prices.
    (state.mode === "all" && a.mode !== b.mode ? (a.mode === "sale" ? -1 : 1) : 0) ||
    (s === "price-asc" ? priceNum(a.price) - priceNum(b.price) :
    s === "price-desc" ? priceNum(b.price) - priceNum(a.price) :
    s === "new" ? String(b.first_seen).localeCompare(String(a.first_seen)) :
    s === "date" ? String(b.listed_on || "").localeCompare(String(a.listed_on || "")) :
    String(a.block).localeCompare(String(b.block)) || priceNum(a.price) - priceNum(b.price)));

  if (!rows.length) {
    const none = !d.listings.length;
    $("list").innerHTML = `<li class="empty"><strong>${none
      ? "No units listed at these blocks right now."
      : "No units match the blocks you've selected."}</strong>${none
      ? "The next check runs tonight at midnight."
      : "Tap a block number above to include it."}</li>`;
    return;
  }
  const showMode = (d.modes || []).length > 1;
  const row = (l, hideDate) => `
    <li class="unit">
      <div class="sign" style="--c:${COLORS[baseBlock(l.block)]}">${esc(l.block)}</div>
      <div>
        <div class="price">${esc(l.price || "Price on request")}${
          showMode ? `<span class="kind">${l.mode === "rent" ? "Rent" : "Sale"}</span>` : ""}${
          isNew(l, d.updated_at) && !l.stale ? `<span class="tag">New</span>` : ""}${
          l.stale ? `<span class="tag stale">Not rechecked</span>` : ""}</div>
        <div class="addr">${esc([l.address, l.size, hideDate ? "" : l.listed].filter(Boolean).join(". "))}</div>
      </div>
      ${l.url ? `<a class="open" href="${esc(l.url)}" target="_blank" rel="noopener">Open listing</a>` : ""}
    </li>`;

  const list = $("list");
  if (s !== "date") {
    list.className = "list";
    list.innerHTML = rows.map((l) => row(l, false)).join("");
    return;
  }
  // One heading per listing date, newest date first, undated units last.
  const groups = new Map();
  for (const l of rows) {
    const key = l.listed_on || "";
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(l);
  }
  const keys = [...groups.keys()].sort((a, b) => (a && b ? b.localeCompare(a) : a ? -1 : 1));
  list.className = "list grouped";
  list.innerHTML = keys.map((key) => {
    const items = groups.get(key);
    items.sort((a, b) => priceNum(a.price) - priceNum(b.price));
    return `<h2 class="daygroup">${key ? esc(fmtDay(key)) : "Date not shown"}` +
      `<span>${plural(items.length)}</span></h2>` + items.map((l) => row(l, true)).join("");
  }).join("");
}

function fmtDay(iso) {
  const d = new Date(iso + "T00:00:00");
  if (isNaN(d)) return iso;
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const days = Math.round((today - d) / 86400000);
  const label = d.toLocaleDateString("en-SG", { day: "numeric", month: "short", year: "numeric" });
  if (days === 0) return `Today, ${label}`;
  if (days === 1) return `Yesterday, ${label}`;
  return label;
}

function render() { renderHeader(); renderBlocks(); renderModes(); renderList(); }

$("blocks").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-block]"); if (!btn) return;
  const b = btn.dataset.block;
  // Tapping the only selected block restores all three.
  if (state.blocks.has(b) && state.blocks.size === 1) state.blocks = new Set(BLOCKS);
  else if (state.blocks.size === BLOCKS.length) state.blocks = new Set([b]);
  else state.blocks.has(b) ? state.blocks.delete(b) : state.blocks.add(b);
  renderBlocks(); renderList();
});
$("modes").addEventListener("click", (e) => {
  const btn = e.target.closest("[data-mode]"); if (!btn) return;
  state.mode = btn.dataset.mode; render();
});
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; renderList(); });

function showTab(name) {
  const units = name === "units";
  $("tab-units").setAttribute("aria-selected", String(units));
  $("tab-logs").setAttribute("aria-selected", String(!units));
  $("panel-units").hidden = !units;
  $("panel-logs").hidden = units;
  if (!units) loadLog();
}
$("tab-units").addEventListener("click", () => showTab("units"));
$("tab-logs").addEventListener("click", () => showTab("logs"));
$("log-refresh").addEventListener("click", () => loadLog());

async function loadLog() {
  const box = $("log"), status = $("log-status");
  try {
    const res = await fetch("data/scraper.log", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const lines = text.trimEnd().split("\n").slice(-800);
    box.innerHTML = lines.map((line) => {
      const cls = /ERROR|Traceback|still blocked|couldn't/i.test(line) ? "err"
                : /WARNING|retry|blocked/i.test(line) ? "warn" : "";
      return cls ? `<span class="${cls}">${esc(line)}</span>` : esc(line);
    }).join("\n");
    box.scrollTop = box.scrollHeight;
    status.textContent = `Last ${lines.length} lines, read ${new Date().toLocaleTimeString("en-SG",
      { hour: "numeric", minute: "2-digit" })}.`;
  } catch (err) {
    box.textContent = "";
    status.textContent = "Couldn't read data/scraper.log yet. It appears once the scraper has started.";
  }
}

async function load() {
  try {
    const res = await fetch("data/results.json", { cache: "no-store" });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    state.data = await res.json();
    state.data.listings = state.data.listings || [];
    render();
  } catch (err) {
    $("status").textContent = "Couldn't read results.json. Check that the scraper container is running " +
      "and that /DATA/AppData/pg-punggol/data is mounted into both containers.";
  }
}
load();
setInterval(() => {
  load();
  if (!$("panel-logs").hidden) loadLog();
}, 10 * 60 * 1000);
</script>
</body>
</html>

# Serves the page and data/, and forwards /api/ to the scraper's control API
# (scheduler.py, port 8000) for the "Check now" button.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's DNS. Looking the scraper up per request (via the variable below) lets
    # nginx start even while the scraper container is still installing or restarting.
    resolver 127.0.0.11 valid=30s ipv6=off;

    location /api/ {
        set $scraper http://scraper:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $scraper;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
